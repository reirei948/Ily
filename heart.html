<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Letter ❤️</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(120deg, #FFDEE9, #B5FFFC);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    overflow: hidden;
    color: #ff0066;
  }

  .container {
    background: rgba(255,255,255,0.85);
    padding: 25px 20px;
    border-radius: 20px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    max-width: 400px;
    position: relative;
  }

  h1 {
    font-size: 1.8em;
    margin-bottom: 20px;
  }

  .buttons {
    margin-top: 20px;
  }

  button {
    font-size: 1.2em;
    padding: 10px 20px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background-color: #ff0066;
    color: white;
    transition: all 0.3s ease;
  }

  button:hover {
    transform: scale(1.1);
  }

  .letter {
    display: none;
    margin-top: 20px;
    font-size: 1.2em;
    line-height: 1.5;
    min-height: 100px;
  }

  .heart {
    color: #ff0066;
    font-size: 1.5em;
    position: absolute;
    animation: rise 5s linear infinite;
  }

  @keyframes rise {
    0% { transform: translateY(100vh) scale(1); opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

</style>
</head>
<body>

<div class="container">
  <h1>Do you love me? 💕</h1>
  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 😢</button>
  </div>

  <div class="letter" id="letter"></div>
</div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const letter = document.getElementById('letter');
const container = document.querySelector('.container');

// No button escapes when hovered
noBtn.addEventListener('mouseover', () => {
  noBtn.style.position = 'relative';
  noBtn.style.left = Math.random() * 100 - 50 + 'px';
  noBtn.style.top = Math.random() * 50 - 25 + 'px';
});

// When Yes clicked: hide buttons, show animated letter
yesBtn.addEventListener('click', () => {
  yesBtn.style.display = 'none';
  noBtn.style.display = 'none';
  displayLetter();
});

// Words of the letter appear one by one
function displayLetter() {
  const text = "Yay! I knew you’d say yes! 😘 Hi babyyy mwhehehe, Thank you for always being there for me, for supporting, listening, understanding, and even satisfying all my cravings, sorry sa pagmamaldita HAHAHHA, love naman kita e, iloveyouuuuuu mwa 💖 [rei] ❤️";
  letter.style.display = 'block';
  let i = 0;

  function typeWord() {
    if (i < text.length) {
      letter.innerHTML += text[i];
      i++;
      setTimeout(typeWord, 100); // speed of typing
    }
  }
  typeWord();
  createHearts();
}

// Floating hearts animation
function createHearts() {
  for(let i=0; i<15; i++){
    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.innerText = Math.random() > 0.5 ? '❤️' : '💖';
    heart.style.left = Math.random() * 100 + '%';
    heart.style.fontSize = (Math.random()*1.5 + 1) + 'em';
    heart.style.animationDuration = (Math.random()*5 + 3) + 's';
    container.appendChild(heart);
  }
}
</script>

</body>
</html>
